<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Studio, Naledi Art</title>
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper:#FBF8F4; --surface:#FFFFFF; --surface-2:#F4EFE8;
    --ink:#241C2C; --ink-soft:#6A5F74; --ink-faint:#9A8FA3;
    --line:#E6DCD2; --line-firm:#D2C5B8;
    --gold:#A87614; --blossom:#C0687F; --leaf:#3F6B46;
    --tap:46px; --gut:18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:#16111D; --surface:#1E1828; --surface-2:#261F33;
      --ink:#F3EDE5; --ink-soft:#AFA3B9; --ink-faint:#7C7088;
      --line:#322A40; --line-firm:#453A56;
      --gold:#E2B155; --blossom:#E7A3B4; --leaf:#8FB286;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:#16111D; --surface:#1E1828; --surface-2:#261F33;
    --ink:#F3EDE5; --ink-soft:#AFA3B9; --ink-faint:#7C7088;
    --line:#322A40; --line-firm:#453A56;
    --gold:#E2B155; --blossom:#E7A3B4; --leaf:#8FB286;
  }
  * { box-sizing:border-box; }
  /* Must outrank the display rules below, or `hidden` on a flex element
     (the sign-out button) does nothing. */
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:400 16px/1.55 Jost,"Century Gothic",system-ui,sans-serif;
         -webkit-font-smoothing:antialiased; padding-bottom:40px; }
  img { max-width:100%; display:block; }
  .wrap { width:100%; max-width:760px; margin-inline:auto; padding-inline:var(--gut); }
  h1,h2,h3 { margin:0; font-weight:400; letter-spacing:-.015em; }
  p { margin:0; }

  header { border-bottom:1px solid var(--line); background:var(--surface);
           padding-block:14px; position:sticky; top:env(safe-area-inset-top,0px); z-index:10; }
  .hrow { display:flex; align-items:center; gap:12px; }
  .hrow img { height:26px; width:auto; }
  .hrow .sp { margin-left:auto; }
  .tag { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }

  .btn { font:inherit; font-size:15px; font-weight:500; cursor:pointer; min-height:var(--tap);
         padding:12px 18px; border-radius:999px; border:1px solid transparent;
         background:var(--ink); color:var(--paper); display:inline-flex; align-items:center;
         justify-content:center; gap:8px; touch-action:manipulation; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--ink); border-color:var(--line-firm); }
  .btn.sm { min-height:38px; padding:8px 14px; font-size:13px; }
  .btn.danger { background:transparent; color:var(--blossom); border-color:var(--line-firm); }
  .btn[disabled] { opacity:.45; cursor:not-allowed; }
  .btn.block { width:100%; }
  @media (pointer:coarse) { .btn.sm { min-height:44px; padding:10px 16px; font-size:14px; } }

  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label { font-size:13px; color:var(--ink-soft); }
  .field input { font:inherit; font-size:16px; min-height:var(--tap); padding:11px 13px;
                 border-radius:11px; border:1px solid var(--line);
                 background:var(--paper); color:var(--ink); width:100%; }
  .field input:focus { outline:2px solid var(--gold); outline-offset:-1px; border-color:transparent; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
          padding:20px; margin-top:20px; }
  .err { color:var(--blossom); font-size:14px; margin-top:10px; }
  .note { font-size:13px; color:var(--ink-faint); }

  .tabs { display:flex; gap:6px; margin:20px 0 4px; flex-wrap:wrap; }
  /* A day booking has pushed someone off their slot: the loudest thing here. */
  .ob { border:1px solid #B4453F; background:#FBEDEC; border-radius:14px;
        padding:16px 18px; margin-bottom:14px; }
  .ob .ob-t { margin:0 0 10px; font-size:15px; font-weight:500; color:#8C2F2A; }
  .ob .ob-d { margin:0 0 6px; font-size:14px; color:#241C2C; }
  .ob .ob-d b { font-variant-numeric:tabular-nums; margin-right:8px; }
  .ob .ob-n { margin:10px 0 0; font-size:13px; color:#6A5F74; }
  .ob a { color:#8C2F2A; }

  .more { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
          padding:16px 0 4px; }

  /* ---- the invoice ---- */
  .invoice { position:fixed; inset:0; background:rgba(20,14,26,.55); z-index:60;
             overflow:auto; padding:20px; }
  .invsheet { max-width:760px; margin:0 auto; background:#FFFFFF; border-radius:14px;
              padding:34px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .invbar { display:flex; gap:10px; justify-content:flex-end; margin-bottom:26px; }
  .ivhead { display:flex; justify-content:space-between; align-items:flex-start;
            gap:20px; border-bottom:1px solid var(--line); padding-bottom:20px; }
  .ivhead img { height:44px; width:auto; }
  .ivno { text-align:right; }
  .ivno b { display:block; font-size:19px; font-weight:500; font-variant-numeric:tabular-nums; }
  .ivno span { font-size:13px; color:var(--faint); }
  .ivcols { display:flex; gap:40px; flex-wrap:wrap; padding:22px 0; }
  .ivcols > div { flex:1; min-width:180px; }
  .ivcols h4 { margin:0 0 7px; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
               color:var(--faint); font-weight:500; }
  .ivcols p { margin:0; font-size:14px; line-height:1.55; color:var(--ink); }
  .ivt { width:100%; border-collapse:collapse; margin-top:8px; }
  .ivt th { text-align:left; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
            color:var(--faint); font-weight:500; padding:0 0 10px; border-bottom:1px solid var(--firm); }
  .ivt td { padding:16px 0; border-bottom:1px solid var(--line); font-size:15px; vertical-align:top; }
  .ivt .r { text-align:right; }
  .ivsub { font-size:13px; color:var(--soft); }
  .ivtot td { font-size:19px; font-weight:500; border-bottom:0; padding-top:18px; }
  .ivfoot { padding-top:20px; }
  .ivl { display:flex; justify-content:space-between; gap:20px; padding:8px 0;
         border-bottom:1px solid var(--line); font-size:14px; }
  .ivl span:first-child { color:var(--faint); }
  .ivl span:last-child { color:var(--ink); text-align:right; }
  .ivfoot .ivsub { padding-top:12px; display:block; }
  .ivnote { padding-top:18px; }
  .ivnote h4 { margin:0 0 6px; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
               color:var(--faint); font-weight:500; }
  .ivnote p { margin:0; font-size:13px; line-height:1.6; color:var(--soft); }
  .ivthanks { margin:18px 0 0; font-size:14px; color:var(--ink); }

  @media print {
    body > *:not(.invoice) { display:none !important; }
    .invoice { position:static; background:#FFFFFF; padding:0; overflow:visible; }
    .invsheet { box-shadow:none; border-radius:0; max-width:none; padding:0; }
    .invbar { display:none; }
  }

  .tab { font:inherit; font-size:14px; min-height:40px; padding:8px 15px; border-radius:999px;
         border:1px solid var(--line); background:transparent; color:var(--ink-soft); cursor:pointer; }
  .tab[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .bk { background:var(--surface); border:1px solid var(--line); border-radius:14px;
        padding:16px; margin-top:10px; }
  .bk.cancelled { opacity:.55; }
  .bk .top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .bk .when { font-size:16px; font-weight:500; font-variant-numeric:tabular-nums; }
  .bk .svc { font-size:13px; color:var(--gold); }
  .bk .amt { margin-left:auto; font-size:15px; font-variant-numeric:tabular-nums; }
  .bk .who { margin-top:8px; font-size:15px; }
  .bk .meta { margin-top:4px; font-size:14px; color:var(--ink-soft); display:flex;
              gap:14px; flex-wrap:wrap; align-items:center; }
  .bk .meta a { color:var(--ink-soft); }
  .bk .notes { margin-top:8px; font-size:14px; color:var(--ink-soft); font-style:italic; }
  .bk .acts { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .bk .ref { font-family:ui-monospace,Menlo,monospace; font-size:11px;
             letter-spacing:.08em; color:var(--ink-faint); margin-left:auto; }
  .pill { font-size:11px; letter-spacing:.1em; text-transform:uppercase;
          padding:3px 9px; border-radius:999px; border:1px solid var(--line-firm); color:var(--ink-faint); }
  .pill.today { color:var(--leaf); border-color:var(--leaf); }
  .pill.wait { color:var(--gold); border-color:var(--gold); }
  .pill.ok { color:var(--leaf); border-color:var(--leaf); }
  .bk.pending { border-color:var(--gold); border-left-width:3px; }
  .btn.confirm { background:var(--leaf); color:#F4FBF4; border-color:var(--leaf); }

  .blk { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .blk:last-child { border-bottom:0; }
  .blk .d { font-variant-numeric:tabular-nums; }
  .blk .x { margin-left:auto; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row input[type=date] { font:inherit; font-size:16px; min-height:var(--tap); padding:10px 12px;
                          border-radius:11px; border:1px solid var(--line);
                          background:var(--paper); color:var(--ink); }
  .empty { color:var(--ink-faint); font-size:14px; padding:14px 0; }
  .sum { display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; }
  .sum div { font-size:13px; color:var(--ink-faint); }
  .sum b { display:block; font-size:22px; font-weight:500; color:var(--ink);
           letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<header>
  <div class="wrap hrow">
    <img src="assets/icon.png" alt="" width="26" height="26">
    <div>
      <div style="font-size:15px;font-weight:500">Studio</div>
      <div class="tag">Naledi Art</div>
    </div>
    <span class="sp"></span>
    <button class="btn ghost sm" id="signOut" hidden>Sign out</button>
  </div>
</header>

<main class="wrap">

  <section id="gate" class="card" style="max-width:420px;margin-inline:auto">
    <h2 style="font-size:20px">Sign in</h2>
    <p class="note" style="margin:6px 0 16px">Only the studio can see bookings.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" inputmode="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn block" id="loginBtn" type="submit">Sign in</button>
    </form>
    <p class="err" id="loginErr" hidden></p>
    <p class="note" style="margin-top:14px">Your password is checked by Supabase, never by this page.
      Forgotten it? Reset the user in the Supabase dashboard.</p>
  </section>

  <section id="app" hidden>
    <div class="ob" id="override" hidden></div>
    <div class="invoice" id="invoice" hidden>
      <div class="invsheet">
        <div class="invbar">
          <button class="btn ghost sm" id="invClose">Close</button>
          <button class="btn sm" id="invPrint">Print or save as PDF</button>
        </div>
        <div id="invBody"></div>
      </div>
    </div>
    <div class="sum" id="summary"></div>

    <div class="tabs">
      <button class="tab" data-view="pending" aria-pressed="true">Needs you</button>
      <button class="tab" data-view="upcoming" aria-pressed="false">Upcoming</button>
      <button class="tab" data-view="today" aria-pressed="false">Today</button>
      <button class="tab" data-view="past" aria-pressed="false">Past</button>
      <button class="tab" data-view="cancelled" aria-pressed="false">Cancelled</button>
      <button class="btn ghost sm" id="zohoCsv" style="margin-left:auto">Export for Zoho</button>
      <button class="btn ghost sm" id="refresh" style="margin-left:auto">Refresh</button>
    </div>

    <p class="err" id="msg" hidden></p>
    <div id="list"></div>

    <div class="card">
      <h3 style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:500">Closed dates</h3>
      <p class="note" style="margin:6px 0 14px">A closed date disappears from the booking calendar.</p>
      <div class="row" style="margin-bottom:14px">
        <input type="date" id="blockDate">
        <button class="btn ghost sm" id="blockAdd">Close this date</button>
      </div>
      <div id="blocks"></div>
    </div>

    <p class="note" style="margin-top:22px">
      <a href="index.html">← Back to the website</a>
    </p>
  </section>
</main>

<script>
(function () {
  "use strict";

  var CFG = {
    url:     "https://wsvdozihlwtnvuoegnzd.supabase.co",
    anonKey: "sb_publishable_W92EOM4CQyRieZwwXqIE7Q_ZWdM07H-"
  };
  var SAST = 120;                      // Durban is UTC+2 all year
  var REST = CFG.url.replace(/\/+$/, '') + '/rest/v1';
  var AUTH = CFG.url.replace(/\/+$/, '') + '/auth/v1';
  var TOKEN_KEY = 'naledi.studio.token';

  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var token = null, rows = [], blocks = [], view = 'pending';
  // Must match expire_stale_requests()'s default in supabase/auto-expiry.sql.
  var HOLD_HOURS = 48;

  function isDead(b) { return b.status === 'cancelled' || b.status === 'expired'; }
  // Pushed off its date by a half or full day booking. Still owed a call.
  function isDisplaced(b) { return b.status === 'displaced'; }

  // How much of the hold window a pending request has left.
  function holdLeft(b) {
    if (!b.created_at) return null;
    var ms = new Date(b.created_at).getTime() + HOLD_HOURS * 3600000 - Date.now();
    if (new Date(b.starts_at).getTime() < Date.now()) return null;  // already under way
    if (ms <= 0) return 'releasing now';
    var h = Math.floor(ms / 3600000);
    return h >= 1 ? 'holds ' + h + 'h' : 'holds ' + Math.max(1, Math.floor(ms / 60000)) + 'm';
  }

  // Kept in sessionStorage, not localStorage: it clears when the tab closes,
  // which is the safer default on a phone that gets handed around.
  function saveToken(t) { token = t; try { t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function loadToken() { try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }

  function headers(extra) {
    var h = { apikey: CFG.anonKey, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
    for (var k in (extra || {})) h[k] = extra[k];
    return h;
  }

  /* ---------------- time ---------------- */
  function sast(iso) { return new Date(new Date(iso).getTime() + SAST * 60000); }
  function dayKey(iso) { return sast(iso).toISOString().slice(0, 10); }
  function timeOf(iso) {
    var d = sast(iso), h = d.getUTCHours(), m = d.getUTCMinutes();
    var ap = h < 12 ? 'am' : 'pm', h12 = h % 12 || 12;
    return h12 + (m ? ':' + pad(m) : '') + ap;
  }
  function longDay(iso) {
    var d = sast(iso);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())
      .toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function todayKey() {
    var n = new Date();
    return new Date(n.getTime() + (n.getTimezoneOffset() + SAST) * 60000).toISOString().slice(0, 10);
  }

  /* ---------------- auth ---------------- */
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
    $('loginErr').hidden = true;
    fetch(AUTH + '/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: CFG.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim(), password: $('pw').value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false; btn.textContent = 'Sign in';
        if (!res.ok || !res.j.access_token) {
          return showLoginErr(res.j.error_description || res.j.msg || 'Those details were not accepted.');
        }
        $('pw').value = '';
        saveToken(res.j.access_token);
        start();
      }).catch(function () {
        btn.disabled = false; btn.textContent = 'Sign in';
        showLoginErr('Could not reach the server. Check your connection.');
      });
  });
  function showLoginErr(m) { var e = $('loginErr'); e.textContent = m; e.hidden = false; }

  $('signOut').addEventListener('click', function () {
    fetch(AUTH + '/logout', { method: 'POST', headers: headers() }).catch(function () {});
    saveToken(null); rows = []; blocks = [];
    $('app').hidden = true; $('gate').hidden = false; $('signOut').hidden = true;
  });

  function signedOut(msg) {
    saveToken(null);
    $('app').hidden = true; $('gate').hidden = false; $('signOut').hidden = true;
    if (msg) showLoginErr(msg);
  }

  /* ---------------- invoicing ----------------
     The studio's own details live in public.studio_settings, behind the same
     admin login as the bookings, NOT in this file: studio.html is served
     from GitHub Pages and anyone can read its source. A bank account on an
     invoice is not a secret, but publishing one on the open web is a
     different thing from sending it to a client.

     These are only the fallbacks used before the row loads, and they carry
     nothing that should not be public. */
  var BILLING = {
    trading_name: 'Naledi Art',
    address: '39 Station Drive, Greyville\nDurban 4001\nSouth Africa',
    phone: '', email: '', reg_no: '', vat_no: '', bank: '',
    terms: 'Due on receipt', notes: '', thanks: ''
  };

  function loadSettings() {
    return fetch(REST + '/studio_settings?select=*&id=eq.1', { headers: headers() })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (rows) {
        if (rows && rows[0]) {
          Object.keys(rows[0]).forEach(function (k) {
            if (rows[0][k] != null && rows[0][k] !== '') BILLING[k] = rows[0][k];
          });
        }
      })
      .catch(function () { /* the invoice still prints, minus the extras */ });
  }

  var nl = function (v) { return esc(v).replace(/\n/g, '<br>'); };

  function invoiceNo(b) {
    // Zoho is already issuing INV-0000nn and counting. Numbering from here
    // as well would eventually give two different documents the same
    // number, so this one is identified by the booking reference, which is
    // unique and which the client already has.
    return 'NAS-' + String(b.ref || '').toUpperCase();
  }
  function moneyOf(b) {
    var m = String(b.amount || '').replace(/[^0-9.]/g, '');
    return m ? Number(m) : null;
  }
  function whenOf(b) {
    var a = new Date(b.starts_at), z = new Date(b.ends_at);
    var f = function (d) {
      return d.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit', hour12: false,
                                             timeZone: 'Africa/Johannesburg' });
    };
    return a.toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long',
                                           year: 'numeric', timeZone: 'Africa/Johannesburg' }) +
           ', ' + f(a) + ' to ' + f(z);
  }

  function openInvoice(b) {
    var amt = moneyOf(b);
    var line = function (label, value) {
      return value ? '<div class="ivl"><span>' + esc(label) + '</span><span>' + nl(value) + '</span></div>' : '';
    };
    $('invBody').innerHTML =
      '<div class="ivhead">' +
        '<div><img src="assets/logo.png" alt="Naledi Art Studio" width="150" height="61"></div>' +
        '<div class="ivno"><b>' + esc(invoiceNo(b)) + '</b><span>' +
          new Date().toLocaleDateString('en-ZA', { day: 'numeric', month: 'long', year: 'numeric' }) +
        '</span></div>' +
      '</div>' +
      '<div class="ivcols">' +
        '<div><h4>From</h4><p><b>' + esc(BILLING.trading_name) + '</b><br>' + nl(BILLING.address) +
          (BILLING.phone ? '<br>' + esc(BILLING.phone) : '') +
          (BILLING.email ? '<br>' + esc(BILLING.email) : '') +
          (BILLING.reg_no ? '<br>Reg ' + esc(BILLING.reg_no) : '') +
          (BILLING.vat_no ? '<br>VAT ' + esc(BILLING.vat_no) : '') + '</p></div>' +
        '<div><h4>Billed to</h4><p><b>' + esc(b.name) + '</b>' +
          (b.phone ? '<br>' + esc(b.phone) : '') +
          (b.email ? '<br>' + esc(b.email) : '') + '</p></div>' +
      '</div>' +
      '<table class="ivt"><tr><th>Description</th><th class="r">Amount</th></tr>' +
        '<tr><td><b>' + esc(b.service_name) + '</b><br><span class="ivsub">' + esc(whenOf(b)) + '</span>' +
          (b.notes ? '<br><span class="ivsub">' + esc(b.notes) + '</span>' : '') + '</td>' +
        '<td class="r">' + esc(b.amount || '') + '</td></tr>' +
        '<tr class="ivtot"><td class="r">Total due</td><td class="r">' +
          (amt !== null ? 'R' + amt.toLocaleString('en-ZA') : esc(b.amount || '')) + '</td></tr>' +
      '</table>' +
      '<div class="ivfoot">' +
        line('Booking reference', b.ref) +
        line('Payment terms', BILLING.terms) +
        line('Banking', BILLING.bank) +
        (BILLING.notes ? '<div class="ivnote"><h4>Kindly note</h4><p>' + nl(BILLING.notes) + '</p></div>' : '') +
        (BILLING.thanks ? '<p class="ivthanks">' + esc(BILLING.thanks) + '</p>' : '') +
        (BILLING.vat_no ? '' : '<p class="ivsub">Not registered for VAT. No VAT is charged on this invoice.</p>') +
      '</div>';
    $('invoice').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeInvoice() { $('invoice').hidden = true; document.body.style.overflow = ''; }

  // Zoho Books imports invoices from CSV. These are its field names, so the
  // file drops straight into Sales > Invoices > Import.
  function zohoCsv(list) {
    var head = ['Invoice Date', 'Customer Name', 'Item Name',
                'Item Description', 'Quantity', 'Item Price', 'Reference Number',
                'Email', 'Phone', 'Notes'];
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var rows = list.map(function (b) {
      return [new Date(b.starts_at).toISOString().slice(0, 10), b.name,
              b.service_name, whenOf(b), 1, moneyOf(b) === null ? '' : moneyOf(b),
              b.ref, b.email || '', b.phone || '', b.notes || ''].map(q).join(',');
    });
    return head.map(q).join(',') + '\n' + rows.join('\n');
  }
  function downloadZoho() {
    var list = filtered().filter(function (b) { return !isDead(b) && b.status === 'confirmed'; });
    if (!list.length) return;
    var blob = new Blob([zohoCsv(list)], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'naledi-invoices-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  /* ---------------- data ---------------- */
  // A month of history is kept in the live set so "Past" opens with
  // something on it before the first page of the archive lands.
  var PAST_PAGE = 50;
  var past = { rows: [], offset: 0, more: true, busy: false, loaded: false };

  function liveFrom() {
    var d = new Date(Date.now() - 31 * 864e5);
    return encodeURIComponent(d.toISOString());
  }

  // The archive, oldest-falls-off-the-end, a page at a time.
  function loadPast(reset) {
    if (reset) { past = { rows: [], offset: 0, more: true, busy: false, loaded: true }; }
    if (past.busy || !past.more) return Promise.resolve();
    past.busy = true; render();
    return fetch(REST + '/bookings?select=*&starts_at=lt.' + liveFrom() +
                 '&order=starts_at.desc&limit=' + PAST_PAGE + '&offset=' + past.offset,
                 { headers: headers() })
      .then(function (r) {
        if (r.status === 401) { signedOut('Your session expired. Sign in again.'); return null; }
        return r.json();
      })
      .then(function (out) {
        past.busy = false;
        if (!out) return;
        var got = Array.isArray(out) ? out : [];
        past.rows = past.rows.concat(got);
        past.offset += got.length;
        past.more = got.length === PAST_PAGE;
        render();
      })
      .catch(function () { past.busy = false; past.more = false; render(); });
  }

  function load() {
    loadSettings();
    return Promise.all([
      // Everything from a month back forward. At the studio's busiest that
      // is under a hundred rows, and it can never push the live tabs out of
      // the window the way one flat limit did. The archive is paged, below.
      fetch(REST + '/bookings?select=*&starts_at=gte.' + liveFrom() +
            '&order=starts_at.desc&limit=1000', { headers: headers() }),
      fetch(REST + '/blocks?select=day&order=day', { headers: headers() })
    ]).then(function (rs) {
      if (rs[0].status === 401 || rs[1].status === 401) { signedOut('Your session expired. Sign in again.'); return null; }
      return Promise.all([rs[0].json(), rs[1].json()]);
    }).then(function (out) {
      if (!out) return;
      // An authenticated but non-allowlisted account sees an empty array here,
      // never an error, that is RLS doing its job.
      rows = Array.isArray(out[0]) ? out[0] : [];
      blocks = Array.isArray(out[1]) ? out[1] : [];
      render();
    });
  }

  function start() {
    $('gate').hidden = true; $('app').hidden = false; $('signOut').hidden = false;
    $('list').innerHTML = '<div class="empty">Loading…</div>';
    load();
  }

  /* ---------------- render ---------------- */
  var allRows = [];
  function filtered() {
    var t = todayKey();
    var src = (view === 'past' || view === 'cancelled') ? allRows : rows;
    return src.filter(function (b) {
      var k = dayKey(b.starts_at);
      if (view === 'cancelled') return isDead(b);
      if (isDead(b)) return false;
      if (isDisplaced(b) && view !== 'pending') return false;
      // "Needs you" is the action queue: requests not yet confirmed, and
      // only ones still ahead, a pending slot that has already passed is
      // history, not a to-do.
      if (view === 'pending') return (b.status === 'pending' || isDisplaced(b)) && k >= t;
      if (view === 'today') return k === t;
      if (view === 'upcoming') return k >= t;
      return k < t;
    }).sort(function (a, b) {
      return view === 'past' || view === 'cancelled'
        ? (a.starts_at < b.starts_at ? 1 : -1)
        : (a.starts_at > b.starts_at ? 1 : -1);
    });
  }

  function render() {
    var t = todayKey();
    var live = rows.filter(function (b) { return !isDead(b); });
    // The archive sits behind the live set; a row can be in both when it
    // straddles the month boundary, so it is keyed out by id.
    var seen = {};
    rows.forEach(function (b) { seen[b.id] = true; });
    allRows = rows.concat(past.rows.filter(function (b) { return !seen[b.id]; }));
    var upcoming = live.filter(function (b) { return dayKey(b.starts_at) >= t; });
    var todays = live.filter(function (b) { return dayKey(b.starts_at) === t; });
    var waiting = live.filter(function (b) { return b.status === 'pending' && dayKey(b.starts_at) >= t; });
    var moved = rows.filter(function (b) { return isDisplaced(b) && dayKey(b.starts_at) >= t; });
    var alertBox = $('override');
    if (alertBox) {
      alertBox.hidden = !moved.length;
      if (moved.length) {
        var byDay = {};
        moved.forEach(function (b) { (byDay[dayKey(b.starts_at)] = byDay[dayKey(b.starts_at)] || []).push(b); });
        alertBox.innerHTML =
          '<p class="ob-t">' + moved.length + (moved.length === 1 ? ' client has' : ' clients have') +
          ' been moved off a date and ' + (moved.length === 1 ? 'is' : 'are') + ' waiting on you</p>' +
          Object.keys(byDay).sort().map(function (d) {
            return '<p class="ob-d"><b>' + d + '</b> ' + byDay[d].map(function (b) {
              return esc(b.name) + (b.phone ? ' &middot; <a href="tel:' + esc(b.phone) + '">' + esc(b.phone) + '</a>' : '');
            }).join(' &nbsp;|&nbsp; ') + '</p>';
          }).join('') +
          '<p class="ob-n">A day booking took these dates. Call them, move them, then cancel or re-book each one below.</p>';
      }
    }
    $('summary').innerHTML =
      '<div><b>' + waiting.length + '</b>need confirming</div>' +
      '<div><b>' + todays.length + '</b>today</div>' +
      '<div><b>' + upcoming.length + '</b>upcoming</div>';

    var list = filtered();
    $('list').innerHTML = (list.length ? list.map(card).join('')
      : '<div class="empty">Nothing here.</div>') + pastFoot(list.length);

    $('blocks').innerHTML = blocks.length ? blocks.map(function (b) {
      return '<div class="blk"><span class="d">' + esc(b.day) + '</span><span class="note">Closed</span>' +
             '<span class="x"><button class="btn ghost sm" data-unblock="' + esc(b.day) + '">Reopen</button></span></div>';
    }).join('') : '<div class="empty">No dates closed.</div>';
  }

  // The archive is fetched a page at a time, so the list has to say whether
  // it is showing everything or only what has been asked for so far.
  function pastFoot(shown) {
    if (view !== 'past' && view !== 'cancelled') return '';
    if (past.busy) return '<div class="more"><span class="note">Loading…</span></div>';
    if (past.more) return '<div class="more">' +
      '<button class="btn ghost" id="morePast">Load older bookings</button>' +
      '<span class="note">' + shown + ' shown</span></div>';
    return past.loaded
      ? '<div class="more"><span class="note">' + shown + ' shown, that is all of them.</span></div>'
      : '';
  }

  function card(b) {
    var t = todayKey(), k = dayKey(b.starts_at);
    var cancelled = isDead(b);
    var expired = b.status === 'expired';
    var pending = b.status === 'pending';
    var left = pending ? holdLeft(b) : null;
    var phone = (b.phone || '').replace(/\s+/g, '');
    var wa = phone ? 'https://wa.me/' + phone.replace(/^0/, '27').replace(/^\+/, '') : null;
    return '<article class="bk' + (cancelled ? ' cancelled' : '') + (pending ? ' pending' : '') + '">' +
      '<div class="top">' +
        '<span class="when">' + esc(longDay(b.starts_at)) + ' · ' + esc(timeOf(b.starts_at)) + '–' + esc(timeOf(b.ends_at)) + '</span>' +
        (k === t && !cancelled ? '<span class="pill today">Today</span>' : '') +
        (expired ? '<span class="pill">Lapsed</span>' : (cancelled ? '<span class="pill">Cancelled</span>' : '')) +
        (pending ? '<span class="pill wait">Awaiting you</span>' : '') +
        (left ? '<span class="pill">' + esc(left) + '</span>' : '') +
        (!pending && !cancelled ? '<span class="pill ok">Confirmed</span>' : '') +
        '<span class="amt">' + esc(b.amount || ', ') + '</span>' +
      '</div>' +
      '<div class="svc">' + esc(b.service_name) + '</div>' +
      '<div class="who">' + esc(b.name) + '</div>' +
      '<div class="meta">' +
        (b.phone ? '<a href="tel:' + esc(phone) + '">' + esc(b.phone) + '</a>' : '') +
        (b.email ? '<a href="mailto:' + esc(b.email) + '">' + esc(b.email) + '</a>' : '') +
      '</div>' +
      (b.notes ? '<div class="notes">“' + esc(b.notes) + '”</div>' : '') +
      '<div class="acts">' +
        (pending ? '<button class="btn sm confirm" data-confirm="' + esc(b.id) + '">Confirm booking</button>' : '') +
        (!pending && !cancelled ? '<button class="btn ghost sm" data-invoice="' + esc(b.id) + '">Invoice</button>' : '') +
        (wa ? '<a class="btn ghost sm" target="_blank" rel="noopener" href="' + esc(wa) + '">WhatsApp</a>' : '') +
        (cancelled
          ? '<button class="btn ghost sm" data-restore="' + esc(b.id) + '">Restore</button>'
          : '<button class="btn danger sm" data-cancel="' + esc(b.id) + '">Cancel</button>') +
        '<span class="ref">' + esc(b.ref) + '</span>' +
      '</div>' +
    '</article>';
  }

  /* ---------------- actions ---------------- */
  function say(text) {
    var m = $('msg');
    if (!text) { m.hidden = true; return; }
    m.textContent = text; m.hidden = false;
  }

  function patch(id, body) {
    say('');
    return fetch(REST + '/bookings?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH', headers: headers({ Prefer: 'return=minimal' }), body: JSON.stringify(body)
    }).then(function (r) {
      if (r.status === 401) { signedOut('Your session expired. Sign in again.'); return; }
      if (r.ok) return load();
      return r.text().then(function (t) {
        // Reinstating a lapsed or cancelled booking fails when the time has
        // since been taken. Say so rather than appearing to do nothing.
        say(t.indexOf('23P01') >= 0 || t.indexOf('bookings_no_overlap') >= 0
          ? 'That time has been taken by someone else since, this booking cannot be reinstated.'
          : 'That did not save. Try again.');
        return load();
      });
    }).catch(function () { say('Could not reach the server. Try again.'); });
  }

  document.addEventListener('click', function (e) {
    var cf = e.target.closest('[data-confirm]');
    if (cf) {
      // Confirming only changes status; the slot was already held from the
      // moment the request came in, so nothing about availability moves here.
      cf.disabled = true; cf.textContent = 'Confirming…';
      patch(cf.getAttribute('data-confirm'), { status: 'confirmed', confirmed_at: new Date().toISOString() });
      return;
    }
    var c = e.target.closest('[data-cancel]');
    if (c) {
      // Cancelling frees the slot: the overlap constraint only covers
      // confirmed bookings, so the time opens up again immediately.
      c.disabled = true; c.textContent = 'Cancelling…';
      patch(c.getAttribute('data-cancel'), { status: 'cancelled' });
      return;
    }
    var r = e.target.closest('[data-restore]');
    if (r) {
      r.disabled = true; r.textContent = 'Restoring…';
      // May fail if the slot was taken in the meantime, reload tells the truth.
      patch(r.getAttribute('data-restore'), { status: 'confirmed' });
      return;
    }
    var u = e.target.closest('[data-unblock]');
    if (u) {
      u.disabled = true;
      fetch(REST + '/blocks?day=eq.' + encodeURIComponent(u.getAttribute('data-unblock')),
        { method: 'DELETE', headers: headers({ Prefer: 'return=minimal' }) })
        .then(function (res) { if (res.status === 401) return signedOut('Your session expired. Sign in again.'); load(); });
      return;
    }
    var iv = e.target.closest('[data-invoice]');
    if (iv) {
      var bk = allRows.concat(rows).filter(function (x) { return x.id === iv.getAttribute('data-invoice'); })[0];
      if (bk) openInvoice(bk);
      return;
    }
    if (e.target.closest('#invClose')) { closeInvoice(); return; }
    if (e.target.closest('#invPrint')) { window.print(); return; }
    if (e.target.closest('#zohoCsv')) { downloadZoho(); return; }
    if (e.target.closest('#morePast')) { loadPast(false); return; }
    var tb = e.target.closest('[data-view]');
    if (tb) {
      view = tb.getAttribute('data-view');
      document.querySelectorAll('[data-view]').forEach(function (x) {
        x.setAttribute('aria-pressed', x === tb ? 'true' : 'false');
      });
      render();
      // The archive is only fetched when it is actually looked at.
      if ((view === 'past' || view === 'cancelled') && !past.loaded) loadPast(true);
    }
  });

  $('blockAdd').addEventListener('click', function () {
    var d = $('blockDate').value; if (!d) return;
    fetch(REST + '/blocks', {
      method: 'POST', headers: headers({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ day: d, reason: 'Closed by the studio' })
    }).then(function (r) {
      if (r.status === 401) return signedOut('Your session expired. Sign in again.');
      $('blockDate').value = ''; load();
    });
  });

  $('refresh').addEventListener('click', function () {
    past.loaded = false;
    load().then(function () {
      if (view === 'past' || view === 'cancelled') loadPast(true);
    });
  });

  /* ---------------- boot ---------------- */
  token = loadToken();
  if (token) start(); else { $('gate').hidden = false; }
})();
</script>
</body>
</html>
