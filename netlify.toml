# The site GitHub Pages serves from /docs is the same build Netlify publishes.
# Without this, Netlify publishes the repo root — which has no index.html, so
# the site 404s at / and every page sits under /docs/.
[build]
  publish = "docs"
  command = ""

# /docs/... was briefly the only working path. Keep those links alive.
[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
  force = true

# Netlify matches on the REQUEST path, so "/*.html" never matches "/".
# Security headers therefore go on /* to cover the bare root too.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# These filenames are stable: logo.png is always logo.png. "immutable" told
# every browser and every CDN edge never to check again for a year, so the
# logo update of 27 September 2026 would have stayed invisible to anyone who
# had already opened the site. An hour, revalidated, until the filenames
# carry a content hash.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# The dashboard should never be indexed.
[[headers]]
  for = "/studio.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
