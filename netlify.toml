# The site GitHub Pages serves from /docs is the same build Netlify should
# publish. Without this, Netlify publishes the repo root — which has no
# index.html, so the site 404s and every page sits under /docs/.
[build]
  publish = "docs"

# Nothing to build: docs/ is committed, already built by `node site/deploy.js`.
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The dashboard should never be indexed.
[[headers]]
  for = "/studio.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
